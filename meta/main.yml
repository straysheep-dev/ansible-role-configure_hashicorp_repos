# SPDX-License-Identifier: MIT
galaxy_info:
  author: straysheep-dev
  namespace: straysheep_dev
  role_name: configure_hashicorp_repos
  description: Configure the HashiCorp software repository on Debian and RedHat family systems.
  license: license (MIT)

  min_ansible_version: "2.10"

  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: Fedora
      versions:
        - all
    - name: Rocky
      versions:
        - all
  galaxy_tags:
    - system
    - packaging
    - repository
    - hashicorp
    - devops

dependencies: []
  # List your role dependencies here, one per line. Be sure to remove the '[]' above,
  # if you add dependencies to this list.
